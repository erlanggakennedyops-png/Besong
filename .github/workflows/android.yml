
name: Build BESOUND v1.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Android APK
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}

    steps:
      # 1. Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Periksa file source
      - name: Verify source ZIP
        run: |
          SOURCE="BESOUND_v1.1.2_NOTIFICATION_ARTWORK_PATCH_SOURCE.zip"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan!"
            ls -lah
            exit 1
          fi

          echo "Source ZIP ditemukan."

      # 3. Ekstrak source
      - name: Extract BESOUND source
        run: |
          mkdir -p "$RUNNER_TEMP/besound112"

          unzip -q \
            BESOUND_v1.1.2_NOTIFICATION_ARTWORK_PATCH_SOURCE.zip \
            -d "$RUNNER_TEMP"

          test -f "$RUNNER_TEMP/besound112/settings.gradle.kts"
          test -f "$RUNNER_TEMP/besound112/app/build.gradle.kts"

          echo "SOURCE_DIR=$RUNNER_TEMP/besound112" >> "$GITHUB_ENV"

          echo "Source berhasil diekstrak."

      # 4. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Install SDK yang dibutuhkan
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 8. Verifikasi konfigurasi aplikasi
      - name: Verify BESOUND configuration
        run: |
          grep -q 'applicationId = "com.bei.besound"' \
            "$SOURCE_DIR/app/build.gradle.kts"

          grep -q 'versionCode = 13' \
            "$SOURCE_DIR/app/build.gradle.kts"

          grep -q 'versionName = "1.1.2"' \
            "$SOURCE_DIR/app/build.gradle.kts"

          echo "Konfigurasi BESOUND terverifikasi."

      # 9. Siapkan signing key
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: BESOUND_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          test -s "$BESOUND_KEYSTORE_PATH"

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

          echo "Keystore berhasil diverifikasi."

      # 10. Build APK release
      - name: Build signed release APK
        run: |
          cd "$SOURCE_DIR"

          gradle --no-daemon clean assembleRelease

      # 11. Periksa APK
      - name: Verify APK
        run: |
          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          echo "APK berhasil diverifikasi."
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.1.2-ARTWORK-PATCH
          path: ${{ runner.temp }}/besound112/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Bersihkan signing key
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f "$BESOUND_KEYSTORE_PATH"
w
