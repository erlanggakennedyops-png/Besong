name: Build BESOUND v1.0.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BESOUND_v1.0.0_SOURCE.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Golden Dusk v1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and verify BESOUND source
        run: |
          test -f BESOUND_v1.0.0_SOURCE.zip
          mkdir -p "$RUNNER_TEMP/besound-source"
          unzip -q BESOUND_v1.0.0_SOURCE.zip -d "$RUNNER_TEMP/besound-source"
          cd "$RUNNER_TEMP/besound-source"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/bei/besound/MainActivity.kt
          grep -q 'applicationId = "com.bei.besound"' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          echo "SOURCE_DIR=$RUNNER_TEMP/besound-source" >> "$GITHUB_ENV"

      - name: Prepare signing keystore
        env:
          BESOUND_KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}
        run: |
          test -n "$BESOUND_KEYSTORE_BASE64" || (echo 'Missing BESOUND_KEYSTORE_BASE64 secret' && exit 1)
          test -n "$BESOUND_KEY_ALIAS" || (echo 'Missing BESOUND_KEY_ALIAS secret' && exit 1)
          test -n "$BESOUND_STORE_PASSWORD" || (echo 'Missing BESOUND_STORE_PASSWORD secret' && exit 1)
          test -n "$BESOUND_KEY_PASSWORD" || (echo 'Missing BESOUND_KEY_PASSWORD secret' && exit 1)
          echo "$BESOUND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/besound-upload.jks"
          echo "BESOUND_KEYSTORE_PATH=$RUNNER_TEMP/besound-upload.jks" >> "$GITHUB_ENV"
          echo "BESOUND_KEY_ALIAS=$BESOUND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BESOUND_STORE_PASSWORD=$BESOUND_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BESOUND_KEY_PASSWORD=$BESOUND_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          cd "$SOURCE_DIR"
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.0.0-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
