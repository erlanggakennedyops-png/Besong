
name: Build BESOUND APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BESOUND project
        run: |
          mkdir extracted
          unzip -q BESOUND_Android_Starter_Final_Logo-1.zip -d extracted
          ls -la extracted

      - name: Build BESOUND APK
        working-directory: extracted/BEI_MUSIC
        run: gradle assembleDebug

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-APK
          path: extracted/BEI_MUSIC/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
