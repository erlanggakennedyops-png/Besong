
name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.3.8
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS || secrets.KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD || secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BESOUND_v1.3.8_HOME_HERO_REFRESH_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP v1.3.8 tidak ditemukan di root repository."
            echo "ZIP yang tersedia:"
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          unzip -tq "$ZIP"

          echo "ZIP v1.3.8 berhasil diverifikasi."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/besound-source"

          unzip -q \
            "BESOUND_v1.3.8_HOME_HERO_REFRESH_SOURCE.zip" \
            -d "$RUNNER_TEMP/besound-source"

          SOURCE_DIR="$RUNNER_TEMP/besound-source/BESOUND_v1.3.8_HOME_HERO_REFRESH_SOURCE"

          if [ ! -f "$SOURCE_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$SOURCE_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          echo "Source BESOUND berhasil diekstrak."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify BESOUND configuration
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          grep -Fq 'applicationId = "com.bei.besound"' "$FILE"
          grep -Fq 'versionCode = 39' "$FILE"
          grep -Fq 'versionName = "1.3.8"' "$FILE"

          echo "Package ID: com.bei.besound"
          echo "Version code: 39"
          echo "Version name: 1.3.8"

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret keystore Base64 tidak ditemukan."
            exit 1
          fi

          if [ -z "${BESOUND_KEY_ALIAS:-}" ]; then
            echo "::error::Secret key alias tidak ditemukan."
            exit 1
          fi

          if [ -z "${BESOUND_STORE_PASSWORD:-}" ]; then
            echo "::error::Secret store password tidak ditemukan."
            exit 1
          fi

          if [ -z "${BESOUND_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret key password tidak ditemukan."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          test -s "$BESOUND_KEYSTORE_PATH"

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

          echo "Signing keystore berhasil diverifikasi."

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          "$AAPT" dump badging "$APK" \
            | grep -F "package: name='com.bei.besound' versionCode='39' versionName='1.3.8'"

          echo "APK berhasil diverifikasi."
          ls -lh "$APK"

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.3.8-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: always()
        shell: bash
        run: |
          rm -f "$BESOUND_KEYSTORE_PATH"
