
name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually
        run: |
          echo "Checking Android SDK..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract BESOUND project
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 \
            -type f \
            -iname "BESOUND_v0.4_Golden_Dusk_Upload.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 \
              -type f -iname "*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted \
            -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project: $PROJECT_DIR"

      - name: Build BESOUND APK
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v0.4-Golden-Dusk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
