
name: Build BESOUND v1.1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND APK
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          SOURCE="BESOUND_v1.1.3_DEFAULT_NOTIFICATION_ARTWORK_SOURCE.zip"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan"
            ls -lah
            exit 1
          fi

          unzip -tq "$SOURCE"

      - name: Extract source
        run: |
          unzip -q \
            BESOUND_v1.1.3_DEFAULT_NOTIFICATION_ARTWORK_SOURCE.zip \
            -d "$RUNNER_TEMP"

          SOURCE_DIR="$RUNNER_TEMP/besound112"

          test -f "$SOURCE_DIR/settings.gradle.kts"
          test -f "$SOURCE_DIR/app/build.gradle.kts"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify application version
        run: |
          FILE="$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'applicationId = "com.bei.besound"' "$FILE"
          grep -Fq 'versionCode = 14' "$FILE"
          grep -Fq 'versionName = "1.1.3"' "$FILE"

          test -f "$SOURCE_DIR/app/src/main/res/drawable-nodpi/besound_default_artwork.png"

          echo "BESOUND v1.1.3 verified"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Keystore secret kosong"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          test -s "$BESOUND_KEYSTORE_PATH"

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

      - name: Build signed release APK
        working-directory: ${{ runner.temp }}/besound112
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | grep package

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.1.3-DEFAULT-ARTWORK
          path: ${{ runner.temp }}/besound112/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing key
        if: always()
        run: |
          rm -f "$BESOUND_KEYSTORE_PATH"
