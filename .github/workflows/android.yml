name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BESOUND_v0.8.0_CANONICAL_SOURCE_FIX.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Golden Dusk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract canonical BESOUND source
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/BESOUND_v0.8.0_CANONICAL_SOURCE_FIX.zip"
          test -f "$ZIP_FILE" || { echo "Source ZIP not found: $ZIP_FILE"; exit 1; }
          mkdir -p "$RUNNER_TEMP/besound-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/besound-source"
          test -f "$RUNNER_TEMP/besound-source/settings.gradle.kts"
          test -f "$RUNNER_TEMP/besound-source/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/besound-source/app/src/main/java/com/bei/music/MainActivity.kt"
          echo "PROJECT_DIR=$RUNNER_TEMP/besound-source" >> "$GITHUB_ENV"
          echo "Canonical source extracted and verified."

      - name: Verify gesture source
        run: |
          if grep -n 'import androidx.compose.ui.input.pointer.awaitPointerEvent' "$PROJECT_DIR/app/src/main/java/com/bei/music/MainActivity.kt"; then
            echo "Invalid awaitPointerEvent import remains"
            exit 1
          fi
          grep -n 'awaitPointerEvent' "$PROJECT_DIR/app/src/main/java/com/bei/music/MainActivity.kt" || true

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/besound-source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v0.8.0-APK
          path: ${{ runner.temp }}/besound-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
