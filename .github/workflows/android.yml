
name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Golden Dusk
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          echo "Checking Android SDK..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BESOUND source
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 \
            -type f \
            -iname "BESOUND_v0.4_Golden_Dusk_Upload.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 \
              -type f -iname "*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build BESOUND APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            bash gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v0.4-Golden-Dusk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
