
name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.3.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="BESOUND_v1.3.3_BEI_SONG_CLOUD_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source ZIP $ZIP tidak ditemukan di root repository."
            echo "Daftar ZIP yang ditemukan:"
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          unzip -t "$ZIP"

          unzip -Z1 "$ZIP" | grep -q \
            'BESOUND_v1.3.3_BEI_SONG_CLOUD_SOURCE/app/build.gradle.kts'

          echo "Source ZIP berhasil diverifikasi."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/besound-source

          unzip -q \
            BESOUND_v1.3.3_BEI_SONG_CLOUD_SOURCE.zip \
            -d /tmp/besound-source

          SOURCE="/tmp/besound-source/BESOUND_v1.3.3_BEI_SONG_CLOUD_SOURCE"

          if [ ! -d "$SOURCE/app/src/main" ]; then
            echo "::error::Struktur source Android tidak lengkap."
            exit 1
          fi

          cp -a "$SOURCE/." .

          echo "Source BESOUND v1.3.3 berhasil diekstrak."

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew tidak ditemukan. Wrapper lama harus tetap ada di repository."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify BESOUND configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"

          grep -q 'applicationId = "com.bei.besound"' "$GRADLE_FILE"
          grep -q 'versionCode = 34' "$GRADLE_FILE"
          grep -q 'versionName = "1.3.3"' "$GRADLE_FILE"

          echo "Package ID: com.bei.besound"
          echo "Version: 1.3.3"
          echo "Version code: 34"

      - name: Prepare signing keystore
        shell: bash
        env:
          BESOUND_KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${BESOUND_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret keystore Base64 tidak ditemukan."
            exit 1
          fi

          if [ -z "${BESOUND_STORE_PASSWORD:-}" ] || \
             [ -z "${BESOUND_KEY_ALIAS:-}" ] || \
             [ -z "${BESOUND_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret signing belum lengkap."
            exit 1
          fi

          echo "$BESOUND_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/besound-release.jks"

          test -s "$RUNNER_TEMP/besound-release.jks"

          echo "BESOUND_KEYSTORE_PATH=$RUNNER_TEMP/besound-release.jks" >> "$GITHUB_ENV"
          echo "BESOUND_STORE_PASSWORD=$BESOUND_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BESOUND_KEY_ALIAS=$BESOUND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BESOUND_KEY_PASSWORD=$BESOUND_KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing keystore berhasil disiapkan."

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK berhasil dibuat dan tanda tangan digital valid."
          ls -lh "$APK"

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.3.3-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/besound-release.jks"
