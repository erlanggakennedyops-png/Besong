
name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.4.0
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS || secrets.KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD || secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f \
            \( -name 'BESOUND_v1.4.0_IMAGE_IMPORT_FIX_SOURCE.zip' \
            -o -name 'BESOUND_v1.4.0_IMAGE_IMPORT_FIX_SOURCE-1.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP BESOUND v1.4.0 tidak ditemukan."
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          unzip -tq "$ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_OUTPUT"
          echo "ZIP valid: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/besound-source"

          unzip -q "${{ steps.source.outputs.ZIP_PATH }}" \
            -d "$RUNNER_TEMP/besound-source"

          SOURCE_DIR="$RUNNER_TEMP/besound-source/BESOUND_v1.4.0_IMAGE_IMPORT_FIX_SOURCE"

          test -f "$SOURCE_DIR/settings.gradle.kts"
          test -f "$SOURCE_DIR/build.gradle.kts"
          test -f "$SOURCE_DIR/app/build.gradle.kts"

          cp -a "$SOURCE_DIR/." "$GITHUB_WORKSPACE/"

          echo "Source berhasil diekstrak."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify BESOUND configuration
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          grep -Fq 'applicationId = "com.bei.besound"' "$FILE"
          grep -Fq 'versionCode = 41' "$FILE"
          grep -Fq 'versionName = "1.4.0"' "$FILE"

          grep -Fq 'import androidx.compose.material.icons.filled.Image' \
            app/src/main/java/com/bei/besound/BeiSongCloud.kt

          echo "Package: com.bei.besound"
          echo "Version: 1.4.0"
          echo "Image icon import: OK"

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "::error::Keystore Base64 secret tidak ditemukan."
            exit 1
          }

          test -n "${BESOUND_KEY_ALIAS:-}" || {
            echo "::error::Key alias tidak ditemukan."
            exit 1
          }

          test -n "${BESOUND_STORE_PASSWORD:-}" || {
            echo "::error::Store password tidak ditemukan."
            exit 1
          }

          test -n "${BESOUND_KEY_PASSWORD:-}" || {
            echo "::error::Key password tidak ditemukan."
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          test -s "$BESOUND_KEYSTORE_PATH"

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

      - name: Build signed release APK
        run: |
          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"

          "$APKSIGNER" verify --verbose "$APK"

          "$AAPT" dump badging "$APK" \
            | grep -F "package: name='com.bei.besound' versionCode='41' versionName='1.4.0'"

          ls -lh "$APK"

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.4.0-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: always()
        run: rm -f "$BESOUND_KEYSTORE_PATH"
