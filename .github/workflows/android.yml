name: Build BESOUND v1.2.6 Signature Branding

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Android APK
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify source ZIP
        id: source
        shell: bash
        run: |
          SOURCE=$(find . -maxdepth 1 -type f \
            -name 'BESOUND_v1.2.6_SIGNATURE_BORDER_FIX_SOURCE*.zip' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Source ZIP BESOUND v1.2.6 Signature Branding tidak ditemukan di root repository."
            echo "Pastikan file BESOUND_v1.2.6_SIGNATURE_BORDER_FIX_SOURCE.zip sudah diunggah ke root repository."
            echo "Daftar ZIP yang ditemukan:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "ZIP ditemukan: $SOURCE"
          unzip -tq "$SOURCE"
          echo "zip_path=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/besound-source"
          unzip -q "${{ steps.source.outputs.zip_path }}" -d "$RUNNER_TEMP/besound-source"

          SOURCE_DIR=$(find "$RUNNER_TEMP/besound-source" \
            -maxdepth 5 -type f -name settings.gradle.kts \
            -print -quit | xargs -r dirname)

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Struktur proyek Android tidak ditemukan di dalam ZIP."
            find "$RUNNER_TEMP/besound-source" -maxdepth 5 -type f -print
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Source directory: $SOURCE_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify BESOUND configuration
        shell: bash
        run: |
          FILE="$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'applicationId = "com.bei.besound"' "$FILE" || {
            echo "ERROR: Package ID tidak sesuai."
            exit 1
          }
          grep -Fq 'versionCode = 27' "$FILE" || {
            echo "ERROR: Version code bukan 26."
            exit 1
          }
          grep -Fq 'versionName = "1.2.6"' "$FILE" || {
            echo "ERROR: Version name bukan 1.2.6."
            exit 1
          }

          echo "Package ID, version code, dan version name terverifikasi."

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: BESOUND_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          if [ ! -s "$BESOUND_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore kosong."
            exit 1
          fi

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

          echo "Keystore berhasil diverifikasi."

      - name: Build signed release APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$SOURCE_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.bei.besound' versionCode='27' versionName='1.2.6'"

          echo "APK signed dan konfigurasi aplikasi berhasil diverifikasi."

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.2.6-SIGNATURE-BORDER-FIX
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: always()
        run: rm -f "$BESOUND_KEYSTORE_PATH"
