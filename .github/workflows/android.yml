name: Build BESOUND Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.5.0
    runs-on: ubuntu-latest
    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS || secrets.KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD || secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BESOUND_v1.5.0_THREE_DOT_MENU_SOURCE.zip"
          test -s "$ZIP" || { echo "::error::Upload $ZIP to the repository root."; exit 1; }
          unzip -tq "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/besound"
          unzip -q "${{ steps.source.outputs.zip }}" -d "$RUNNER_TEMP/besound"
          SRC="$RUNNER_TEMP/besound/BESOUND_v1.5.0_THREE_DOT_MENU"
          test -f "$SRC/app/build.gradle.kts"
          cp -a "$SRC/." "$GITHUB_WORKSPACE/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify app identity
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          grep -Fq 'applicationId = "com.bei.besound"' "$FILE"
          grep -Fq 'versionCode = 51' "$FILE"
          grep -Fq 'versionName = "1.5.0"' "$FILE"

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::Keystore Base64 secret missing."; exit 1; }
          test -n "${BESOUND_KEY_ALIAS:-}" || { echo "::error::Key alias secret missing."; exit 1; }
          test -n "${BESOUND_STORE_PASSWORD:-}" || { echo "::error::Store password secret missing."; exit 1; }
          test -n "${BESOUND_KEY_PASSWORD:-}" || { echo "::error::Key password secret missing."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BESOUND_KEYSTORE_PATH"
          test -s "$BESOUND_KEYSTORE_PATH"
          keytool -list -keystore "$BESOUND_KEYSTORE_PATH" -storepass "$BESOUND_STORE_PASSWORD" -alias "$BESOUND_KEY_ALIAS"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/BESOUND-v1.5.0.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/BESOUND-v1.5.0.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan: $APK"
            find app/build/outputs release -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          BADGING=$("$AAPT" dump badging "$APK")

          echo "=== APK PACKAGE INFO ==="
          echo "$BADGING" | head -n 1

          echo "=== CHECK PACKAGE ID ==="
          echo "$BADGING" | grep -F "name='com.bei.besound'"

          echo "=== CHECK VERSION CODE ==="
          echo "$BADGING" | grep -F "versionCode='51'"

          echo "=== CHECK VERSION NAME ==="
          echo "$BADGING" | grep -F "versionName='1.5.0'"

          echo "=== VERIFY APK SIGNATURE ==="
          "$APKSIGNER" verify --verbose "$APK"

          echo "=== APK FILE ==="
          ls -lh "$APK"
          echo "BESOUND v1.5.0 APK verification successful."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.5.0-Release
          path: release/BESOUND-v1.5.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore
        if: always()
        run: rm -f "$BESOUND_KEYSTORE_PATH"
