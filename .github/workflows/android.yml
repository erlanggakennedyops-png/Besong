
name: Build BESOUND v1.3.3 BEI SONG CLOUD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND Android APK
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and verify source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=$(find . -maxdepth 1 -type f \
            -name 'BESOUND_v1.3.3_BEI_SONG_CLOUD_SOURCE.zip' \
            -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "::error::ZIP v1.3.3 tidak ditemukan di root repository."
            find . -maxdepth 1 -type f -name '*.zip'
            exit 1
          fi

          unzip -tq "$SOURCE"

          echo "zip_path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "ZIP berhasil diverifikasi."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/besound-source"

          unzip -q "${{ steps.source.outputs.zip_path }}" \
            -d "$RUNNER_TEMP/besound-source"

          SOURCE_DIR=$(find "$RUNNER_TEMP/besound-source" \
            -maxdepth 5 -type f -name settings.gradle.kts \
            -print -quit | xargs -r dirname)

          if [ -z "$SOURCE_DIR" ] || \
             [ ! -f "$SOURCE_DIR/app/build.gradle.kts" ]; then
            echo "::error::Struktur proyek Android tidak lengkap."
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Source: $SOURCE_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify BESOUND configuration
        shell: bash
        run: |
          set -euo pipefail

          FILE="$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'applicationId = "com.bei.besound"' "$FILE"
          grep -Fq 'versionCode = 34' "$FILE"
          grep -Fq 'versionName = "1.3.3"' "$FILE"

          echo "Package ID dan versi berhasil diverifikasi."

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::BESOUND_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          if [ -z "${BESOUND_KEY_ALIAS:-}" ] || \
             [ -z "${BESOUND_STORE_PASSWORD:-}" ] || \
             [ -z "${BESOUND_KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets belum lengkap."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          test -s "$BESOUND_KEYSTORE_PATH"

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

          echo "Keystore berhasil diverifikasi."

      - name: Build signed release APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            find "$SOURCE_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose \
            --min-sdk-version 26 "$APK"

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK")

          echo "$BADGING" | grep -F \
            "package: name='com.bei.besound' versionCode='34' versionName='1.3.3'"

          echo "APK berhasil diverifikasi."

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.3.3-BEI-SONG-CLOUD
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: always()
        run: rm -f "$BESOUND_KEYSTORE_PATH"
