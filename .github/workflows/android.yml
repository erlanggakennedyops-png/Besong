name: Build BESOUND Golden Dusk v1.0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BESOUND_v1.0.1_SOURCE.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.0.1
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and verify BESOUND source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/BESOUND_v1.0.1_SOURCE.zip"
          SOURCE_DIR="$RUNNER_TEMP/besound-source"
          test -f "$ZIP_FILE"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/settings.gradle.kts"
          test -f "$SOURCE_DIR/app/build.gradle.kts"
          test -f "$SOURCE_DIR/app/src/main/AndroidManifest.xml"
          test -f "$SOURCE_DIR/app/src/main/java/com/bei/besound/MainActivity.kt"
          grep -q 'applicationId = "com.bei.besound"' "$SOURCE_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 2' "$SOURCE_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.0.1"' "$SOURCE_DIR/app/build.gradle.kts"
          grep -q 'PlayerNotificationManager' "$SOURCE_DIR/app/src/main/java/com/bei/besound/MainActivity.kt"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "BESOUND source verified."

      - name: Prepare and verify signing keystore
        shell: bash
        env:
          BESOUND_KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BESOUND_KEYSTORE_BASE64"
          test -n "$BESOUND_KEY_ALIAS"
          test -n "$BESOUND_STORE_PASSWORD"
          test -n "$BESOUND_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/besound-release.jks"
          printf '%s' "$BESOUND_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS" >/dev/null
          echo "BESOUND_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Signing keystore and alias verified."

      - name: Build signed release APK
        shell: bash
        env:
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.bei.besound'|versionCode='2'|versionName='1.0.1'"
          ls -lh "$APK"

      - name: Upload BESOUND v1.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.0.1-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
