
name: Build BESOUND v1.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build BESOUND
    runs-on: ubuntu-latest

    env:
      BESOUND_KEYSTORE_PATH: ${{ github.workspace }}/besound-release.jks
      BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
      BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
      BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          SOURCE="BESOUND_v1.1.2_NOTIFICATION_ARTWORK_PATCH_SOURCE.zip"
          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE not found in repository root."
            ls -la
            exit 1
          fi

      - name: Extract source
        run: |
          unzip -q BESOUND_v1.1.2_NOTIFICATION_ARTWORK_PATCH_SOURCE.zip
          test -d besound112
          echo "Source extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: BESOUND_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BESOUND_KEYSTORE_PATH"

          if [ ! -s "$BESOUND_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$BESOUND_KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS"

      - name: Build signed release APK
        working-directory: besound112
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          APK="besound112/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          apksigner verify --verbose "$APK"
          echo "APK signature verified."

      - name: Upload BESOUND APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.1.2-ARTWORK-PATCH
          path: besound112/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
