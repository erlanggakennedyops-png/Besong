
name: Build BESOUND v1.0.2 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BESOUND v1.0.2
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and verify BESOUND source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/BESOUND_v1.0.2_SOURCE.zip"
          SOURCE_DIR="$RUNNER_TEMP/besound-source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: BESOUND_v1.0.2_SOURCE.zip not found"
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          test -f "$SOURCE_DIR/settings.gradle.kts"
          test -f "$SOURCE_DIR/build.gradle.kts"
          test -f "$SOURCE_DIR/app/build.gradle.kts"
          test -f "$SOURCE_DIR/app/src/main/AndroidManifest.xml"
          test -f "$SOURCE_DIR/app/src/main/java/com/bei/besound/MainActivity.kt"

          grep -Fq 'applicationId = "com.bei.besound"' \
            "$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'versionCode = 3' \
            "$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'versionName = "1.0.2"' \
            "$SOURCE_DIR/app/build.gradle.kts"

          grep -Fq 'PlayerNotificationManager' \
            "$SOURCE_DIR/app/src/main/java/com/bei/besound/MainActivity.kt"

          echo "BESOUND source v1.0.2 verified."

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Prepare and verify signing keystore
        shell: bash
        env:
          BESOUND_KEYSTORE_BASE64: ${{ secrets.BESOUND_KEYSTORE_BASE64 }}
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BESOUND_KEYSTORE_BASE64" ] ||
             [ -z "$BESOUND_KEY_ALIAS" ] ||
             [ -z "$BESOUND_STORE_PASSWORD" ] ||
             [ -z "$BESOUND_KEY_PASSWORD" ]; then
            echo "ERROR: One or more signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/besound-release.jks"

          printf '%s' "$BESOUND_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$BESOUND_STORE_PASSWORD" \
            -alias "$BESOUND_KEY_ALIAS" \
            >/dev/null

          echo "BESOUND_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Signing keystore verified."

      - name: Build signed release APK
        shell: bash
        env:
          BESOUND_KEYSTORE_PATH: ${{ env.BESOUND_KEYSTORE_PATH }}
          BESOUND_KEY_ALIAS: ${{ secrets.BESOUND_KEY_ALIAS }}
          BESOUND_STORE_PASSWORD: ${{ secrets.BESOUND_STORE_PASSWORD }}
          BESOUND_KEY_PASSWORD: ${{ secrets.BESOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          gradle --no-daemon clean assembleRelease

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/release/BESOUND-v1.0.2.apk"

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release/BESOUND-v1.0.2.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "$APK"

          "$AAPT" dump badging "$APK" | grep \
            "package: name='com.bei.besound' versionCode='3' versionName='1.0.2'"

          echo "APK signature and package verified."

      - name: Upload BESOUND v1.0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: BESOUND-v1.0.2-APK
          path: release/BESOUND-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
